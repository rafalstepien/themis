[project]
name = "themis"
version = "0.1.0"
description = "GitLab-native AI code review validation gate that analyzes Merge Requests for logic bugs, security vulnerabilities, and architectural errors"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click>=8.4.1",
    "httpx>=0.24.0",
    "openai>=1.60.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.16",
    "ty>=0.0.49",
]

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = [
    ".git",
    ".cache",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",  # Pyflakes and pycodestyle (defaults)
    "F",  # Pyflakes and pycodestyle (defaults)
    "I", # I = isort
    "B", # B = flake8-bugbear
]
ignore = [
    "E501", # Ignore line-length violations (let ruff format handle it)
]

fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
# known-first-party = ["my_project_name"]  # Automatically group your project's internal packages into the "first-party" section
combine-as-imports = true  # Force multiple from imports from the same module onto a single line
force-sort-within-sections = true  # Forces standard library imports to be sorted alphabetically rather than by length

[tool.coverage.run]
branch = true  # Track branch coverage so untested if/else paths (e.g. display_path) surface, not just unrun lines
source = ["src"]
omit = [
    "*/__init__.py",   # Package markers, no logic
    "*/ports/*",       # Ports are Protocol interfaces (contracts), nothing to execute
]

[tool.coverage.report]
show_missing = true      # Print the exact line/branch numbers that are uncovered
skip_covered = false     # Keep fully-covered files in the table so the picture stays complete
exclude_also = [
    "if TYPE_CHECKING:",              # Import-only blocks, never executed at runtime
    "raise NotImplementedError",      # Abstract stubs
    "@(abc\\.)?abstractmethod",       # Abstract method declarations
    "class .*\\(Protocol\\):",        # Structural-typing contracts (belt-and-braces with the ports omit)
    "^\\s*\\.\\.\\.\\s*$",            # Ellipsis-only bodies (Protocol / stub methods)
]
